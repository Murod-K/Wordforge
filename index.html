<style>
:root{
  --bg:#eef0fb; --bg2:#e7e9f9; --card:#ffffff; --card2:#f4f4fc;
  --border:#e9e9f6; --text:#1c1a34; --text2:#77799a; --text3:#a2a3c2;
  --accent:#7c5cfc; --accent2:#5b3fd6; --accent-grad:linear-gradient(135deg,#8f6ffc,#5b3fd6);
  --teal:#7c5cfc; --teal2:#5b3fd6; --brand-grad:linear-gradient(135deg,#8f6ffc,#5b3fd6);
  --accent-rgb:124,92,252; --teal-rgb:124,92,252;
  --pink:#ec4899; --amber:#f59e0b;
  --good:#16a34a; --warn:#d97706; --bad:#ef4444;
  --gold:#f59e0b; --radius:22px;
  --nav-h:66px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{ -webkit-text-size-adjust:100%; }
body{
  max-width:100vw;
  background:
    radial-gradient(circle at 10% -8%, rgba(var(--accent-rgb),.10), transparent 40%),
    radial-gradient(circle at 100% 6%, rgba(var(--accent-rgb),.07), transparent 38%),
    var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  overscroll-behavior-y:none;
  letter-spacing:-.1px;
}
#app{max-width:600px; margin:0 auto; padding-bottom:calc(var(--nav-h) + var(--safe-b) + 18px);}

@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

/* ---- HEADER ---- */
header{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + var(--safe-t)) 16px 14px;
  background:rgba(238,240,251,.78); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:clamp(16px,4.5vw,19px); letter-spacing:-.3px; color:var(--text);}
.brand .logo{
  width:36px; height:36px; border-radius:13px; flex-shrink:0;
  background:var(--brand-grad);
  box-shadow:0 6px 16px rgba(var(--accent-rgb),.4);
  display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; color:#fff;
}
.brand-tag{font-size:10px; font-weight:700; color:var(--text2); letter-spacing:.2px; margin-top:1px;}
.hstats{display:flex; gap:8px; align-items:center;}
.hpill{
  display:flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--border);
  padding:7px 11px; border-radius:20px; font-size:13px; font-weight:700; white-space:nowrap;
  box-shadow:0 3px 10px rgba(124,92,252,.10);
}
.level-badge{
  background:var(--accent-grad); padding:7px 12px; box-shadow:0 4px 12px rgba(var(--accent-rgb),.35);
  border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; color:#fff;
}
.focus-pill{
  background:var(--card); border:1px solid var(--accent); color:var(--accent2); padding:7px 13px;
  border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap;
}

/* ---- CONTENT ---- */
main{ padding:16px 14px 4px; }
.card{
  background:var(--card);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; margin-bottom:14px;
  box-shadow:0 10px 28px rgba(92,63,214,.09);
  animation:fadeIn .25s ease;
}
.card h2{font-size:15px; margin-bottom:12px; color:var(--text); font-weight:800; letter-spacing:-.2px;}
.big-num{font-size:clamp(28px,9vw,38px); font-weight:800; line-height:1; letter-spacing:-.5px; color:var(--accent2);}
.sub{color:var(--text2); font-size:13px; margin-top:4px; line-height:1.45;}

.btn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:16px 20px; border-radius:16px; border:none;
  background:var(--accent-grad); color:#fff; font-weight:700; font-size:15.5px; cursor:pointer;
  width:100%; text-align:center; min-height:54px; transition:transform .1s, filter .15s, box-shadow .15s;
  box-shadow:0 10px 22px rgba(var(--accent-rgb),.34);
}
.btn:active{transform:scale(.97);}
.btn:hover{filter:brightness(1.06);}
.btn.secondary{background:var(--card2); color:var(--accent2); border:1px solid var(--border); box-shadow:none;}
.btn.ghost{background:transparent; color:var(--text2); border:1px solid var(--border); box-shadow:none;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.mini-card .l{font-size:11px; color:var(--text2); margin-top:3px;}
.mini-card:nth-child(2) .n{color:var(--pink);}
.mini-card:nth-child(3) .n{color:var(--amber);}
.mini-card:nth-child(4) .n{color:var(--good);}

/* ---- EXERCISE ---- */

.pos-tag{
  display:inline-block; font-size:11px; padding:5px 12px; border-radius:20px;
  background:var(--card2); color:var(--accent2); border:1px solid var(--border);
  text-transform:uppercase; letter-spacing:.5px; font-weight:700;
}
.example-sent{color:var(--text2); font-size:14.5px; font-style:italic; margin:14px 0; line-height:1.55;}
.example-sent b{color:var(--accent2); font-style:normal;}
.speak-btn{
  background:var(--accent-grad); border:none; color:#fff; border-radius:50%;
  width:46px; height:46px; cursor:pointer; font-size:18px; margin-top:10px;
  display:inline-flex; align-items:center; justify-content:center; transition:transform .1s;
  box-shadow:0 6px 16px rgba(var(--accent-rgb),.35);
}
.speak-btn:active{transform:scale(.9);}
.options{display:flex; flex-direction:column; gap:10px; margin-top:18px; width:100%;}
.opt-btn{
  width:100%; display:block;
  background:var(--card2); border:1.5px solid var(--border); color:var(--text);
  padding:16px; border-radius:16px; font-size:15.5px; cursor:pointer; text-align:left;
  min-height:54px; transition:transform .1s, border-color .15s, background .15s;
}
.opt-btn:active{transform:scale(.98);}
.opt-btn.correct{background:rgba(22,163,74,.14); border-color:var(--good); color:#14532d;}
.opt-btn.wrong{background:rgba(239,68,68,.13); border-color:var(--bad); color:#7f1d1d;}
.type-input{
  width:100%; padding:16px; border-radius:16px; border:1.5px solid transparent;
  background:var(--card2); color:var(--text); font-size:16px; margin-top:18px; text-align:center;
  min-height:54px;
}
.type-input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px rgba(var(--accent-rgb),.15);}
.rate-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:20px;}
.rate-btn{padding:14px 3px; border-radius:14px; border:none; font-weight:700; font-size:12.5px; cursor:pointer; color:#fff; min-height:50px; transition:transform .1s;}

.rate-again{background:var(--bad);} .rate-hard{background:var(--warn);}
.rate-good{background:var(--good);} .rate-easy{background:var(--accent-grad);}
.progressbar{height:7px; background:var(--card2); border-radius:8px; overflow:hidden; margin:0 14px 12px;}
.progressbar-fill{height:100%; background:var(--accent-grad); border-radius:8px; transition:width .3s;}
.flip-hint{color:var(--text3); font-size:12.5px; margin-top:12px;}
.focus-hint{color:var(--text3); font-size:11.5px; margin:0 14px 12px; text-align:center;}

/* ---- SPELL DIFF ---- */
.spell-result{font-size:24px; letter-spacing:1px; margin-top:14px; font-weight:800; font-family:'Segoe UI',system-ui,sans-serif;}
.sp-ok{color:var(--good);}
.sp-bad{color:var(--bad); text-decoration:line-through; text-decoration-thickness:2px;}
.sp-missing{color:var(--text3); text-decoration:underline dotted;}
.correct-word{margin-top:8px; font-size:14px; color:var(--text2);}
.correct-word b{color:var(--accent2); font-size:16px;}

/* ---- DICTIONARY ---- */
.dict-search{
  width:100%; padding:14px 18px; border-radius:30px; border:1.5px solid transparent;

}
.dict-search:focus{outline:none; background:#fff; border-color:var(--accent);}

.filter-chip{
  padding:9px 15px; border-radius:20px; font-size:13px; cursor:pointer; font-weight:700;

.filter-chip:active{transform:scale(.95);}
.filter-chip.active{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(var(--accent-rgb),.3);}

.dict-row:last-child{border-bottom:none;}

.ach-name{font-weight:700; font-size:14.5px; color:var(--text);}
.ach-desc{font-size:12.5px; color:var(--text2); margin-top:1px;}

.empty-state{text-align:center; padding:36px 10px; color:var(--text2);}

.toggle-row .desc{font-size:12px; color:var(--text2); margin-top:3px; line-height:1.4;}
.switch{position:relative; width:46px; height:27px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0; position:absolute;}
.slider{position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:var(--card2); border:1px solid var(--border); border-radius:27px; transition:.2s;}
.slider:before{position:absolute; content:""; height:19px; width:19px; left:3px; top:3px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.2); border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--accent-grad); border-color:transparent;}
.switch input:checked + .slider:before{transform:translateX(19px);}

.install-card{
  background:var(--accent-grad);
  border:none; color:#fff;
}

/* ---- TOAST ---- */
.toast{
  position:fixed; bottom:calc(var(--nav-h) + var(--safe-b) + 16px); left:50%; transform:translateX(-50%);

  padding:13px 22px; border-radius:16px; font-size:14px; font-weight:600;
  opacity:0; transition:.3s; pointer-events:none; z-index:99; white-space:nowrap;
  max-width:88vw; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 12px 28px rgba(28,26,52,.28);
}
.toast.show{opacity:1;}

/* ---- BOTTOM NAV ---- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;

}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;

}
.nav-item:active{transform:scale(.92);}
.nav-item.active{color:var(--accent2);}
.nav-item .ic{font-size:19px; line-height:1; transition:.15s; padding:4px 13px; border-radius:12px;}
.nav-item.active .ic{background:rgba(var(--accent-rgb),.14); box-shadow:inset 0 0 0 1.5px rgba(var(--accent-rgb),.3);}
.nav-item .lb{font-size:10px; font-weight:700;}
.nav-item .badge{
  position:absolute; margin-left:14px; margin-top:-14px; background:var(--bad); color:#fff;
  font-size:9px; font-weight:800; border-radius:20px; padding:1px 5px; min-width:14px; text-align:center;
}
</style>

const LS_KEY = "ielts_6_forge_state_v1";
function loadState(){
  let raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  let progress = {};
  WORDS.forEach((w)=>{
    progress[w.w] = {rep:0, ef:2.5, interval:0, due:0, status:"new", correct:0, wrong:0, stage:"new", recCorrect:0, mistakes:[]};
  });
  return {
    progress, xp:0, streak:0, lastActive:null, history:{},
    dailyGoal:12, sessionDate:null, sessionDoneToday:0,
    unlocked:[], installHintDismissed:false, typingMode:true, focusMode:true
  };
}
let STATE = loadState();
if(STATE.typingMode === undefined){ STATE.typingMode = true; }
if(STATE.focusMode === undefined){ STATE.focusMode = true; }
let _migrated = false;
WORDS.forEach((w)=>{
  if(!STATE.progress[w.w]){
    STATE.progress[w.w] = {rep:0, ef:2.5, interval:0, due:0, status:"new", correct:0, wrong:0, stage:"new", recCorrect:0, mistakes:[]};
    _migrated = true;
  }
});
// миграция: добавляем журнал опечаток тем, у кого его ещё нет
Object.keys(STATE.progress).forEach(k=>{
  const p = STATE.progress[k];
  if(p.mistakes === undefined){ p.mistakes = []; _migrated = true; }
});
// пересчёт статусов под пороги SRS
Object.keys(STATE.progress).forEach(k=>{
  const p = STATE.progress[k];
  if(p.status !== "new"){
    const newStatus = p.rep >= 4 ? "mastered" : (p.rep >= 2 ? "review" : "learning");
    if(newStatus !== p.status){ p.status = newStatus; _migrated = true; }
  }
});
// миграция на этапную систему (новое → узнавание → полноценный SRS)
Object.keys(STATE.progress).forEach(k=>{
  const p = STATE.progress[k];
  if(p.stage === undefined){
    p.stage = p.rep > 0 ? "production" : (p.status === "new" ? "new" : "recognition");
    p.recCorrect = p.recCorrect || 0;
    _migrated = true;
  }
});
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
if(_migrated) save();
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function touchStreak(){
  const t = todayStr();
  if(STATE.lastActive === t) return;
  if(STATE.lastActive){
    const gap = daysBetween(STATE.lastActive, t);
    if(gap === 1) STATE.streak += 1;
    else if(gap > 1) STATE.streak = 1;
  } else {
    STATE.streak = 1;
  }
  STATE.lastActive = t;
  STATE.history[t] = (STATE.history[t]||0);
  STATE.sessionDate = t;
  STATE.sessionDoneToday = 0;
  save();
}

/* ============ SRS ENGINE (быстрые ранние шаги + статус по числу успешных повторений) ============ */
function scheduleWord(word, quality){
  const p = STATE.progress[word];
  p.ef = Math.max(1.3, p.ef + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  if(quality < 3){
    p.rep = 0; p.interval = 1; p.status = "learning"; p.wrong++;
  } else {
    p.correct++;
    if(p.rep === 0) p.interval = 1;
    else if(p.rep === 1) p.interval = 2;
    else if(p.rep === 2) p.interval = 4;
    else if(p.rep === 3) p.interval = 8;
    else p.interval = Math.round(p.interval * p.ef);
    p.rep += 1;
    p.status = p.rep >= 4 ? "mastered" : (p.rep >= 2 ? "review" : "learning");
  }
  p.due = daysBetween("1970-01-01", todayStr()) + p.interval;
  save();
}
function dueEpoch(){ return daysBetween("1970-01-01", todayStr()); }

/* ============ RETRY QUEUE (закрепление ошибок в той же сессии) ============
   Слово, отвеченное неверно, не просто уходит на завтра по SRS — оно ещё
   раз всплывает через несколько карточек в этой же сессии. Это классический
   приём "immediate re-testing", который заметно ускоряет запоминание
   написания. Ограничено 2 повторными показами за сессию, чтобы не зациклить
   человека на одном сложном слове. */
function requeueForRetry(word){
  if(!SESSION) return;
  SESSION.missCounts = SESSION.missCounts || {};
  const c = SESSION.missCounts[word.w] || 0;
  if(c >= 2) return;
  SESSION.missCounts[word.w] = c + 1;
  const gap = 3 + Math.floor(Math.random()*3);
  const insertAt = Math.min(SESSION.queue.length, SESSION.idx + gap);
  SESSION.queue.splice(insertAt, 0, word);
}

/* Журнал реальных опечаток — что именно человек написал вместо правильного
   слова. Используется в разделе "Слабые слова", чтобы видно было не только
   "ошибся", а конкретный паттерн ошибки (пропущенная буква, лишняя и т.п.). */
function recordMistake(word, typed){
  const p = STATE.progress[word.w];
  if(!typed) return;
  p.mistakes = p.mistakes || [];
  p.mistakes.push(typed);
  if(p.mistakes.length > 5) p.mistakes = p.mistakes.slice(-5);
  save();
}

/* Слова с наибольшим числом ошибок — приоритет для точечной тренировки орфографии. */
function getWeakWords(limit){
  return WORDS
    .filter(w=>{
      const p = STATE.progress[w.w];
      return p.status !== "new" && p.wrong > 0;
    })
    .sort((a,b)=>{
      const pa = STATE.progress[a.w], pb = STATE.progress[b.w];
      const ra = pa.wrong / (pa.wrong + pa.correct + 1);
      const rb = pb.wrong / (pb.wrong + pb.correct + 1);
      return rb - ra || pb.wrong - pa.wrong;
    })
    .slice(0, limit || 40);
}

function getDueWords(){
  const now = dueEpoch();
  return WORDS.filter(w=>{
    const p = STATE.progress[w.w];
    return p.status !== "new" && p.due <= now;
  });
}
const WIP_LIMIT = 40;
function getActiveCount(){
  return WORDS.filter(w=>{
    const st = STATE.progress[w.w].status;
    return st === "learning" || st === "review";
  }).length;
}
/* Words currently "in progress" (learning/review) regardless of their SRS due date —
   used for on-demand extra reinforcement when nothing is due yet but the WIP slot
   is full, so the person is never fully locked out of practising. */
function getActiveWords(){
  return WORDS.filter(w=>{
    const st = STATE.progress[w.w].status;
    return st === "learning" || st === "review";
  });
}
function getNewWords(limit){
  const room = Math.max(0, WIP_LIMIT - getActiveCount());
  const actualLimit = Math.min(limit, room);
  if(actualLimit <= 0) return [];
  return WORDS
    .filter(w=> STATE.progress[w.w].status === "new")
    .sort((a,b)=> CAT_ORDER[a.cat] - CAT_ORDER[b.cat])
    .slice(0, actualLimit);
}
function stats(){
  let s = {new:0, learning:0, review:0, mastered:0};
  WORDS.forEach(w=> s[STATE.progress[w.w].status]++);
  return s;
}

  const s = stats();
  let newly = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.unlocked.includes(a.id) && a.check(s)){
      STATE.unlocked.push(a.id);
      newly.push(a);
    }
  });
  save();
  return newly;

/* ============ SPELLING DIFF ============ */
function spellDiffHTML(typed, correct){
  if(!typed) return `<div class="spell-result"><span class="sp-missing">${escapeHtml(correct)}</span></div>`;
  let out = "";
  const maxLen = Math.max(typed.length, correct.length);
  for(let i=0;i<maxLen;i++){
    const tc = typed[i] || "";
    const cc = correct[i] || "";
    if(tc && tc.toLowerCase() === cc.toLowerCase()){
      out += `<span class="sp-ok">${escapeHtml(tc)}</span>`;
    } else if(tc){
      out += `<span class="sp-bad">${escapeHtml(tc)}</span>`;
    } else {
      out += `<span class="sp-missing">${escapeHtml(cc)}</span>`;
    }
  }
  return `<div class="spell-result">${out}</div>`;
}

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }

/* ============ UI ============ */
let VIEW = "today";
let SESSION = null;
let TEST = null;

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
/* Voices load asynchronously in many browsers (esp. mobile WebViews) — warm them up
   as soon as the app starts so the first speak() call doesn't fire before they exist. */
let _voicesReady = [];
function _refreshVoices(){ try{ _voicesReady = speechSynthesis.getVoices() || []; }catch(e){} }
if("speechSynthesis" in window){
  _refreshVoices();
  speechSynthesis.onvoiceschanged = _refreshVoices;
}
function pickEnglishVoice(){
  if(!_voicesReady.length) _refreshVoices();
  return _voicesReady.find(v=>/en-GB/i.test(v.lang))
      || _voicesReady.find(v=>/en-US/i.test(v.lang))
      || _voicesReady.find(v=>/^en/i.test(v.lang))
      || null;
}
function speak(text){
  if(!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined"){
    toast("Голосовой синтез недоступен в этом браузере");
    return;
  }
  try{
    speechSynthesis.cancel(); // stop any utterance stuck mid-playback before starting a new one
    const u = new SpeechSynthesisUtterance(text);
    const voice = pickEnglishVoice();
    if(voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-GB"; }
    u.rate = 0.88;
    u.onerror = ()=> toast("Не удалось воспроизвести звук — попробуй ещё раз");
    // Some mobile browsers need speak() called directly inside the click handler;
    // a tiny delay after cancel() avoids the "interrupted" glitch on iOS Safari.
    setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){ toast("Ошибка воспроизведения звука"); } }, 30);
  }catch(e){
    toast("Ошибка воспроизведения звука");
  }
}
function levelFromXP(xp){ return Math.floor(Math.sqrt(xp/40)) + 1; }

const NAV_ITEMS = [
  {id:"today", ic:"📖", lb:"Практика"},
  {id:"test", ic:"📝", lb:"Тест"},
  {id:"dict", ic:"🔤", lb:"Слова"},
  {id:"stats", ic:"📊", lb:"Прогресс"},
  {id:"ach", ic:"🏅", lb:"Награды"},
];

function render(){
  touchStreak();
  const lvl = levelFromXP(STATE.xp);
  const app = document.getElementById("app");
  const hideStats = SESSION && STATE.focusMode && SESSION.idx < SESSION.queue.length;
  app.innerHTML = `
    <header>
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <div>LexiSpark</div>
          <div class="brand-tag">Target Band 6.0</div>
        </div>
      </div>
      <div class="hstats">
        ${hideStats ? `<div class="focus-pill">🎯 Фокус</div>` : `
          <div class="hpill">🔥 ${STATE.streak}</div>
          <div class="level-badge">Ур.${lvl} · ${STATE.xp} XP</div>
        `}
      </div>
    </header>
    <main id="view"></main>
    <nav class="bottom-nav">
      ${NAV_ITEMS.map(item=>`
        <div class="nav-item ${VIEW===item.id?'active':''}" onclick="setView('${item.id}')">
          <div class="ic">${item.ic}</div>
          <div class="lb">${item.lb}</div>
        </div>
      `).join("")}
    </nav>
  `;
  renderView();
}

function setView(v){ VIEW = v; SESSION = null; if(v !== "test") TEST = null; render(); window.scrollTo(0,0); }

function renderView(){
  if(VIEW === "today") renderToday();
  if(VIEW === "test") renderTest();
  if(VIEW === "dict") renderDict();
  if(VIEW === "stats") renderStats();
  if(VIEW === "ach") renderAch();
}

/* ---- INSTALL HINT ---- */
function installHintHTML(){
  if(STATE.installHintDismissed || isStandalone()) return "";
  const steps = isIOS()
    ? `Нажми <b>Поделиться</b> (значок ⬆️ внизу Safari) → <b>«На экран Домой»</b>`
    : `Нажми меню <b>⋮</b> в углу Chrome → <b>«Добавить на главный экран»</b>`;
  return `
    <div class="card install-card">
      <div class="row">
        <div>📲</div>
        <div>
          <div style="font-weight:700; font-size:14.5px;">Добавь LexiSpark на главный экран</div>
          <div class="sub" style="margin-top:2px;">Заходи одним нажатием, как в обычное приложение</div>
        </div>
      </div>
      <div class="steps">${steps}</div>
      <button class="close" onclick="dismissInstallHint()">Скрыть подсказку</button>
    </div>
  `;
}
function dismissInstallHint(){ STATE.installHintDismissed = true; save(); render(); }

/* ---- TODAY / SESSION ---- */
function renderToday(){
  const holder = document.getElementById("view");
  if(SESSION){ renderSession(); return; }
  const due = getDueWords();
  const newAvail = getNewWords(999).length;
  const s = stats();
  const activeCount = getActiveCount();
  const activeWords = getActiveWords();
  const totalNewLeft = WORDS.filter(w=>STATE.progress[w.w].status==="new").length;
  const isCapped = activeCount >= WIP_LIMIT && totalNewLeft > 0;
  const started = getStartedWords();
  const wodPool = started.length > 0 ? started : WORDS.filter(w=>w.cat==="trap");
  const wordOfDay = wodPool[dueEpoch() % wodPool.length];
  const mastered = WORDS.filter(w=>STATE.progress[w.w].status==="mastered");
  const weakWords = getWeakWords(40);

  const nothingDueOrNew = (due.length + newAvail) === 0;
  const canExtraReview = nothingDueOrNew && activeWords.length > 0;

  let startLabel = '▶ Начать занятие';
  let startAction = 'startSession()';
  let startDisabled = false;
  if(nothingDueOrNew){
    if(canExtraReview){
      startLabel = `🔁 Повторить слова в изучении (${activeWords.length})`;
      startAction = 'startActiveReview()';
    } else {
      startLabel = 'Все слова повторены 🎉';
      startDisabled = true;
    }
  }

  holder.innerHTML = `
    ${installHintHTML()}
    <div class="card">
      <div class="big-num">${due.length + Math.min(newAvail, 6)}</div>
      <div class="sub">слов готово к изучению сегодня</div>
      <div class="progressbar" style="margin:14px 0 0; padding:0;">
        <div class="progressbar-fill" style="width:${Math.min(100, (STATE.sessionDoneToday/STATE.dailyGoal)*100)}%"></div>
      </div>
      <div class="sub">${STATE.sessionDoneToday} / ${STATE.dailyGoal} выполнено сегодня</div>
      <div style="margin-top:16px;">
        <button class="btn" onclick="${startAction}" ${startDisabled?'disabled':''}>
          ${startLabel}
        </button>
      </div>
      ${isCapped ? `
      <div class="sub" style="margin-top:10px; text-align:center;">
        📦 Лимит «в изучении» заполнен (${WIP_LIMIT}) — новые слова откроются, когда часть текущих будет усвоена. ${canExtraReview? 'А пока можно закреплять уже начатые слова кнопкой выше.' : ''}
      </div>` : ''}
      <div class="toggle-row" style="border-top:none; padding-top:2px; margin-top:14px;">
        <div>
          <div class="label">📦 В изучении сейчас</div>
          <div class="desc">${activeCount} / ${WIP_LIMIT} слов${isCapped? ' — новые слова придержаны, пока не освободится место' : ''}</div>
        </div>
      </div>
      <div class="progressbar" style="margin:8px 0 0; padding:0;">
        <div class="progressbar-fill" style="width:${Math.min(100,(activeCount/WIP_LIMIT)*100)}%; background:${isCapped? 'var(--warn)':'var(--accent-grad)'};"></div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="label">✍️ Строгий ввод (retrieval)</div>
          <div class="desc">Больше заданий на активное написание слова вместо карточек-переворотов — точнее закрепляет орфографию для Listening</div>
        </div>
        <label class="switch">
          <input type="checkbox" ${STATE.typingMode? 'checked':''} onchange="toggleTypingMode()">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="label">🎯 Режим фокуса</div>
          <div class="desc">Прячет счётчики и прогресс-бар во время упражнений — меньше отвлекающей нагрузки, больше концентрации на слове</div>
        </div>
        <label class="switch">
          <input type="checkbox" ${STATE.focusMode? 'checked':''} onchange="toggleFocusMode()">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    ${activeWords.length > 0 ? `
    <div class="card">
      <h2>💪 Дополнительная практика</h2>
      <div class="sub">${activeWords.length} слов сейчас в изучении (ещё не усвоены). Можно потренировать их прямо сейчас, не дожидаясь запланированного повторения по SRS — это не собьёт основной план и не потратит дневную цель.</div>
      <button class="btn secondary" style="margin-top:12px;" onclick="startActiveReview()">Повторить слова в изучении (${activeWords.length})</button>
    </div>` : ''}
    ${mastered.length > 0 ? `
    <div class="card">
      <h2>🔁 Повторить усвоенные</h2>
      <div class="sub">${mastered.length} слов уже усвоено — можно освежить их в памяти отдельным раундом, не трогая обычный план на сегодня.</div>
      <button class="btn secondary" style="margin-top:12px;" onclick="startMasteredReview()">Повторить все усвоенные (${mastered.length})</button>
    </div>` : ''}
    ${weakWords.length > 0 ? `
    <div class="card">
      <h2>🧠 Слабые слова</h2>
      <div class="sub">${weakWords.length} слов, в которых ты чаще всего ошибаешься. Отдельный раунд — только письмо и орфография, без переводных карточек.</div>
      <div style="margin:12px 0;">
        ${weakWords.slice(0,4).map(w=>{
          const p = STATE.progress[w.w];
          const lastTypo = p.mistakes && p.mistakes.length ? p.mistakes[p.mistakes.length-1] : null;
          return `<div class="dict-row">
            <div>
              <div class="dict-w">${w.w}</div>
              ${lastTypo ? `<div class="dict-t" style="color:var(--bad);">писал(а): ${escapeHtml(lastTypo)}</div>` : ''}
            </div>
            <span class="pos-tag">${p.wrong} ошиб.</span>
          </div>`;
        }).join("")}
      </div>
      <button class="btn secondary" onclick="startWeakReview()">Отработать слабые слова (${weakWords.length})</button>
    </div>` : ''}
    <div class="card">
      <h2>📌 Слово дня</h2>
      <div class="dict-w" style="font-size:21px;">${wordOfDay.w} <span class="pos-tag">${CAT_LABELS[wordOfDay.cat]}</span></div>
      <div class="dict-t" style="margin:6px 0; font-size:14px;">${wordOfDay.t}</div>
      <div class="example-sent" style="margin-bottom:0;">${wordOfDay.ex}</div>
    </div>
    <div class="grid2">
      <div class="mini-card"><div class="n">${due.length}</div><div class="l">на повторении</div></div>
      <div class="mini-card"><div class="n">${s.new}</div><div class="l">новых</div></div>
      <div class="mini-card"><div class="n">${s.mastered}</div><div class="l">усвоено</div></div>
      <div class="mini-card"><div class="n">${Math.round((s.mastered/WORDS.length)*100)}%</div><div class="l">весь словарь</div></div>
    </div>
  `;
}

function startSession(){
  const due = getDueWords();
  const fresh = getNewWords(5);
  let pool = [...due, ...fresh];
  pool = pool.sort(()=>Math.random()-0.5).slice(0, Math.max(10, STATE.dailyGoal));
  if(pool.length === 0){ toast("Нет слов для занятия!"); return; }
  SESSION = { queue: pool, idx:0, correctCount:0, mode:null, revealed:false, feedback:null };
  render();
}

function startMasteredReview(){
  const mastered = WORDS.filter(w=>STATE.progress[w.w].status==="mastered");
  if(mastered.length === 0){ toast("Пока нет усвоенных слов"); return; }
  const pool = [...mastered].sort(()=>Math.random()-0.5);
  SESSION = { queue: pool, idx:0, correctCount:0, mode:null, revealed:false, feedback:null, isReview:true };
  render();
}

/* Extra reinforcement round for words already "in progress" (learning/review) —
   ignores their SRS due date on purpose, so the person is never stuck waiting
   even when the WIP limit blocks new words. Answers still update the SRS record
   as normal reps, so good performance here still helps the word graduate sooner. */
function startActiveReview(){
  const active = getActiveWords();
  if(active.length === 0){ toast("Пока нет слов в изучении"); return; }
  const pool = [...active].sort(()=>Math.random()-0.5);
  SESSION = { queue: pool, idx:0, correctCount:0, mode:null, revealed:false, feedback:null, isReview:true };
  render();
}

/* Прицельная тренировка орфографии слов, в которых чаще всего ошибаются —
   только продуктивные (пишущие) упражнения, без переводных карточек. */
function startWeakReview(){
  const weak = getWeakWords(40);
  if(weak.length === 0){ toast("Слабых слов пока нет — отлично!"); return; }
  SESSION = { queue: [...weak], idx:0, correctCount:0, mode:null, revealed:false, feedback:null, isReview:true, forceSpelling:true };
  render();
}

/* Interleaving: exercise types are mixed randomly within a session so the brain
   keeps switching context — flashcard / type / cloze / synonym match / listening spelling */
function pickExerciseType(word){
  const p = STATE.progress[word.w];
  if(p.status === "new") return "intro";
  if(p.stage === "recognition") return "choice";
  if(SESSION && SESSION.forceSpelling){
    // Слабые слова: только упражнения на активное написание, без карточек-переворотов и переводного выбора
    const spellTypes = ["type","cloze","listen","lcwc"];
    return spellTypes[Math.floor(Math.random()*spellTypes.length)];
  }
  let types = STATE.typingMode
    ? ["type","cloze","listen","lcwc","flashcard"]
    : ["flashcard","type","cloze","listen","lcwc"];
  if(word.syn) types.push("synmatch");
  return types[Math.floor(Math.random()*types.length)];
}
function toggleTypingMode(){
  STATE.typingMode = !STATE.typingMode;
  save();
  render();
  toast(STATE.typingMode ? "Строгий ввод включён" : "Строгий ввод выключен");
}
function toggleFocusMode(){
  STATE.focusMode = !STATE.focusMode;
  save();
  render();
  toast(STATE.focusMode ? "Режим фокуса включён" : "Режим фокуса выключен");
}

function renderSession(){
  const holder = document.getElementById("view");
  if(SESSION.idx >= SESSION.queue.length){
    const gained = SESSION.correctCount * 10;
    STATE.xp += gained;
    if(!SESSION.isReview) STATE.sessionDoneToday += SESSION.queue.length;
    STATE.history[todayStr()] = (STATE.history[todayStr()]||0) + SESSION.queue.length;
    save();
    const newly = checkAchievements();
    holder.innerHTML = `
      <div class="card" style="text-align:center;">
        <div style="font-size:46px;">${SESSION.isReview? '🔁' : '🎉'}</div>
        <h2 style="margin-top:10px;">${SESSION.isReview? 'Повтор завершён!' : 'Занятие завершено!'}</h2>
        <div class="grid2" style="margin-top:16px;">
          <div class="mini-card"><div class="n">+${gained}</div><div class="l">XP получено</div></div>
          <div class="mini-card"><div class="n">${SESSION.correctCount}/${SESSION.queue.length}</div><div class="l">правильно</div></div>
        </div>
        ${newly.length? `<div class="sub" style="margin-top:14px;">🏆 Новая награда: ${newly.map(a=>a.name).join(", ")}</div>`:''}
        <button class="btn" style="margin-top:18px;" onclick="SESSION=null; setView('today')">Готово</button>
      </div>`;
    return;
  }
  const word = SESSION.queue[SESSION.idx];
  if(!SESSION.mode){ SESSION.mode = pickExerciseType(word); SESSION.revealed = false; SESSION.feedback = null; SESSION.spoken = false; SESSION.lcwcPhase = null; }
  const progressPct = (SESSION.idx / SESSION.queue.length) * 100;

  let body = "";
  if(SESSION.mode === "intro") body = introHTML(word);
  else if(SESSION.mode === "flashcard") body = flashcardHTML(word);
  else if(SESSION.mode === "choice") body = choiceHTML(word);
  else if(SESSION.mode === "type") body = typeHTML(word);
  else if(SESSION.mode === "cloze") body = clozeHTML(word);
  else if(SESSION.mode === "synmatch") body = synMatchHTML(word);
  else if(SESSION.mode === "listen") body = listenHTML(word);
  else if(SESSION.mode === "lcwc") body = lcwcHTML(word);

  if(STATE.focusMode){
    holder.innerHTML = `
      <div class="focus-hint">🎯 Режим фокуса: счётчики скрыты до конца занятия</div>
      <div class="card exercise">${body}</div>
    `;
  } else {
    holder.innerHTML = `
      <div class="progressbar" style="margin:0 0 14px;"><div class="progressbar-fill" style="width:${progressPct}%"></div></div>
      <div class="sub" style="text-align:center; margin:0 0 10px;">${SESSION.idx+1} / ${SESSION.queue.length}</div>
      <div class="card exercise">${body}</div>
    `;
  }
}

function introHTML(word){
  return `
    <div class="pos-tag">✨ Новое слово · ${CAT_LABELS[word.cat]}</div>
    <div class="word-display">${word.w}</div>
    <button class="speak-btn" onclick="speak('${word.w.replace(/'/g,"\\'")}')">🔊</button>
    <div style="font-size:19px; color:var(--accent2); font-weight:700; margin-top:8px;">${word.t}</div>
    <div class="example-sent">${word.ex.replace(new RegExp(word.w.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&'),'i'), '<b>'+word.w+'</b>')}</div>
    <div class="sub" style="margin-top:6px;">Просто запомни — проверять пока не будем</div>
    <button class="btn" style="margin-top:16px;" onclick="confirmIntro()">Понял, дальше →</button>
  `;
}
function confirmIntro(){
  const word = SESSION.queue[SESSION.idx];
  const p = STATE.progress[word.w];
  p.stage = "recognition";
  p.status = "learning";
  save();
  nextCard();
}

function flashcardHTML(word){
  if(!SESSION.revealed){
    return `
      <div class="pos-tag">${word.p} · ${CAT_LABELS[word.cat]}</div>
      <div class="word-display">${word.w}</div>
      <button class="speak-btn" onclick="speak('${word.w.replace(/'/g,"\\'")}')">🔊</button>
      <div class="flip-hint">Напиши перевод текстом, потом посмотри ответ</div>
      <input id="flashGuess" class="type-input" autocomplete="off" autocapitalize="off" placeholder="твой перевод..."
        onkeydown="if(event.key==='Enter')revealCard()">
      <button class="btn" style="margin-top:16px;" onclick="revealCard()">Показать ответ</button>
    `;
  }
  const guess = SESSION.typedGuess || "";
  return `
    <div class="pos-tag">${word.p} · ${CAT_LABELS[word.cat]}</div>
    <div class="word-display">${word.w}</div>
    <div style="font-size:19px; color:var(--accent2); font-weight:700; margin-top:4px;">${word.t}</div>
    ${guess ? `<div class="sub" style="margin-top:6px;">Ты написал: <b style="color:var(--text)">${escapeHtml(guess)}</b></div>` : ''}
    <div class="example-sent">${word.ex}</div>
    <div class="rate-row">
      <button class="rate-btn rate-again" onclick="answerCard(0)">Забыл</button>
      <button class="rate-btn rate-hard" onclick="answerCard(2)">Трудно</button>
      <button class="rate-btn rate-good" onclick="answerCard(4)">Хорошо</button>
      <button class="rate-btn rate-easy" onclick="answerCard(5)">Легко</button>
    </div>
  `;
}
function revealCard(){
  const el = document.getElementById("flashGuess");
  SESSION.typedGuess = el ? el.value.trim() : "";
  SESSION.revealed = true;
  render();
}
function answerCard(q){
  const word = SESSION.queue[SESSION.idx];
  scheduleWord(word.w, q);
  if(q>=3) SESSION.correctCount++;
  else requeueForRetry(word);
  nextCard();
}

function choiceHTML(word){
  if(!SESSION.opts){
    let distractors = WORDS.filter(w=>w.w!==word.w).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.t);
    SESSION.opts = [...distractors, word.t].sort(()=>Math.random()-0.5);
  }
  const p = STATE.progress[word.w];
  const isRecognition = p.stage === "recognition";
  const fb = SESSION.feedback;
  return `
    <div class="pos-tag">${word.p} · ${CAT_LABELS[word.cat]}</div>
    <div class="word-display">${word.w}</div>
    <button class="speak-btn" onclick="speak('${word.w.replace(/'/g,"\\'")}')">🔊</button>
    <div class="sub" style="margin-top:10px;">${isRecognition? `Узнавание — шаг ${p.recCorrect+1} из 2` : 'Выбери правильный перевод'}</div>
    <div class="options">
      ${SESSION.opts.map(o=>{
        let cls = "opt-btn";
        if(fb){
          if(o === word.t) cls += " correct";
          else if(o === fb.picked) cls += " wrong";
        }
        return `<button class="${cls}" ${fb?'disabled':''} onclick="answerChoice('${o.replace(/'/g,"\\'")}')">${o}</button>`;
      }).join("")}
    </div>
    ${fb? `<button class="btn" style="margin-top:16px;" onclick="nextCard()">Далее</button>`:''}
  `;
}
function answerChoice(picked){
  const word = SESSION.queue[SESSION.idx];
  const p = STATE.progress[word.w];
  const correct = picked === word.t;
  SESSION.feedback = {picked, correct};
  if(p.stage === "recognition"){
    if(correct){
      p.recCorrect = (p.recCorrect||0) + 1;
      SESSION.correctCount++;
      if(p.recCorrect >= 2){
        scheduleWord(word.w, 4); // выпускается из "узнавания" в полноценный SRS
      } else {
        save();
      }
    } else {
      p.recCorrect = 0;
      save();
      requeueForRetry(word);
    }
  } else {
    scheduleWord(word.w, correct?4:0);
    if(correct) SESSION.correctCount++;
    else requeueForRetry(word);
  }
  render();
}

function typeHTML(word){
  const fb = SESSION.feedback;
  return `
    <div class="sub" style="font-size:13px;">Определение</div>
    <div style="font-size:16px; margin:8px 0 6px; line-height:1.5;">${word.def}</div>
    <div class="pos-tag">${word.p} · ${CAT_LABELS[word.cat]}</div>
    <div class="sub" style="margin-top:10px;">Напиши слово (или фразу) на английском</div>
    <input id="typeInput" class="type-input" lang="en" inputmode="text" spellcheck="true" autocomplete="off" autocapitalize="off" placeholder="type here..." ${fb?'disabled':''}
      onkeydown="if(event.key==='Enter')submitType()">
    ${fb? `
      ${fb.correct? '' : spellDiffHTML(fb.typed, word.w)}
      <div style="margin-top:12px; color:${fb.correct?'var(--good)':'var(--bad)'}; font-weight:700;">
        ${fb.correct? '✓ Верно!' : 'Ошибка в написании'}
      </div>
      ${fb.correct? '' : `<div class="correct-word">Правильно: <b>${word.w}</b></div>`}
      <button class="btn" style="margin-top:14px;" onclick="nextCard()">Далее</button>
    ` : `<button class="btn secondary" style="margin-top:14px;" onclick="submitType()">Проверить</button>`}
  `;
}
function submitType(){
  const word = SESSION.queue[SESSION.idx];
  const input = document.getElementById("typeInput");
  const typed = (input? input.value : "").trim();
  const correct = typed.toLowerCase() === word.w.toLowerCase();
  SESSION.feedback = {correct, typed};
  scheduleWord(word.w, correct?4:0);
  if(correct) SESSION.correctCount++;
  else { recordMistake(word, typed); requeueForRetry(word); }
  render();
  setTimeout(()=>{ const el=document.getElementById("typeInput"); if(el) el.focus(); }, 50);
}

function clozeHTML(word){
  const fb = SESSION.feedback;
  const re = new RegExp(word.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  const blanked = word.ex.replace(re, '_____');
  return `
    <div class="sub" style="font-size:13px;">Заполни пропуск</div>
    <div class="example-sent" style="font-size:16px; color:var(--text);">${blanked}</div>
    <div class="dict-t" style="margin-bottom:10px;">${word.t}</div>
    <input id="clozeInput" class="type-input" lang="en" inputmode="text" spellcheck="true" autocomplete="off" autocapitalize="off" placeholder="type the word..." ${fb?'disabled':''}
      onkeydown="if(event.key==='Enter')submitCloze()">
    ${fb? `
      ${fb.correct? '' : spellDiffHTML(fb.typed, word.w)}
      <div style="margin-top:12px; color:${fb.correct?'var(--good)':'var(--bad)'}; font-weight:700;">
        ${fb.correct? '✓ Верно!' : 'Ошибка в написании'}
      </div>
      ${fb.correct? '' : `<div class="correct-word">Правильно: <b>${word.w}</b></div>`}
      <button class="btn" style="margin-top:14px;" onclick="nextCard()">Далее</button>
    ` : `<button class="btn secondary" style="margin-top:14px;" onclick="submitCloze()">Проверить</button>`}
  `;
}
function submitCloze(){
  const word = SESSION.queue[SESSION.idx];
  const input = document.getElementById("clozeInput");
  const typed = (input? input.value : "").trim();
  const correct = typed.toLowerCase() === word.w.toLowerCase();
  SESSION.feedback = {correct, typed};
  scheduleWord(word.w, correct?4:0);
  if(correct) SESSION.correctCount++;
  else { recordMistake(word, typed); requeueForRetry(word); }
  render();
  setTimeout(()=>{ const el=document.getElementById("clozeInput"); if(el) el.focus(); }, 50);
}

/* ---- SYNONYM MATCH (elaborative interrogation / paraphrasing for Reading & Listening) ---- */
function synMatchHTML(word){
  if(!SESSION.opts){
    let pool = [...new Set(WORDS.filter(w=>w.w!==word.w && w.syn).map(w=>w.syn))]
      .filter(s=>s.toLowerCase() !== word.syn.toLowerCase());
    let distractors = pool.sort(()=>Math.random()-0.5).slice(0,3);
    SESSION.opts = [...distractors, word.syn].sort(()=>Math.random()-0.5);
  }
  const fb = SESSION.feedback;
  return `
    <div class="pos-tag">🔁 Синоним / парафраз</div>
    <div class="word-display">${word.w}</div>
    <div class="sub" style="margin-top:8px;">Выбери ближайший синоним — этот навык парафраза решает баллы в Reading и Listening</div>
    <div class="options">
      ${SESSION.opts.map(o=>{
        let cls = "opt-btn";
        if(fb){
          if(o === word.syn) cls += " correct";
          else if(o === fb.picked) cls += " wrong";
        }
        return `<button class="${cls}" ${fb?'disabled':''} onclick="answerSynMatch('${o.replace(/'/g,"\\'")}')">${o}</button>`;
      }).join("")}
    </div>
    ${fb? `<button class="btn" style="margin-top:16px;" onclick="nextCard()">Далее</button>`:''}
  `;
}
function answerSynMatch(picked){
  const word = SESSION.queue[SESSION.idx];
  const correct = picked === word.syn;
  SESSION.feedback = {picked, correct};
  scheduleWord(word.w, correct?4:0);
  if(correct) SESSION.correctCount++;
  else requeueForRetry(word);
  render();
}

/* ---- LISTENING SPELLING (strict retrieval — exact spelling, no text shown first) ----
   Playback is only ever triggered by a direct tap on the play button. Auto-playing on
   render (i.e. not inside a click handler) is what mobile browsers were silently
   blocking, which is why audio looked broken. */
function listenHTML(word){
  const fb = SESSION.feedback;
  const wEsc = word.w.replace(/'/g,"\\'");
  return `
    <div class="pos-tag">🎧 Listening Spelling</div>
    <button class="btn secondary" style="margin-top:14px;" onclick="playListenWord('${wEsc}')">🔊 Прослушать слово</button>
    <div class="sub" style="margin-top:10px;">Нажми, чтобы услышать слово, и напиши его без единой ошибки — точно как в IELTS Listening. Можно переслушивать сколько нужно.</div>
    <input id="listenInput" class="type-input" lang="en" inputmode="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="type what you hear..." ${fb?'disabled':''}
      onkeydown="if(event.key==='Enter')submitListen()">
    ${fb? `
      ${fb.correct? '' : spellDiffHTML(fb.typed, word.w)}
      <div style="margin-top:12px; color:${fb.correct?'var(--good)':'var(--bad)'}; font-weight:700;">
        ${fb.correct? '✓ Верно!' : 'Ошибка в написании'}
      </div>
      ${fb.correct? '' : `<div class="correct-word">Правильно: <b>${word.w}</b></div>`}
      <button class="btn" style="margin-top:14px;" onclick="nextCard()">Далее</button>
    ` : `<button class="btn" style="margin-top:14px;" onclick="submitListen()">Проверить</button>`}
  `;
}
function playListenWord(w){
  SESSION.spoken = true;
  speak(w);
}
function submitListen(){
  const word = SESSION.queue[SESSION.idx];
  const input = document.getElementById("listenInput");
  const typed = (input? input.value : "").trim();
  const correct = typed.toLowerCase() === word.w.toLowerCase();
  SESSION.feedback = {correct, typed};
  scheduleWord(word.w, correct?4:0);
  if(correct) SESSION.correctCount++;
  else { recordMistake(word, typed); requeueForRetry(word); }
  render();
  setTimeout(()=>{ const el=document.getElementById("listenInput"); if(el) el.focus(); }, 50);
}

/* ---- LOOK · COVER · WRITE · CHECK ----
   Классическая методика запоминания орфографии: сначала слово внимательно
   рассматривают вместе с переводом, затем закрывают и пишут по памяти,
   и только потом сверяют побуквенно. В отличие от typeHTML/clozeHTML здесь
   человек видит написание слова непосредственно перед тем, как его
   воспроизвести — это тренирует зрительную память написания, а не только
   перевод-из-определения. */
function lcwcHTML(word){
  const fb = SESSION.feedback;
  if(!SESSION.lcwcPhase) SESSION.lcwcPhase = "look";
  if(SESSION.lcwcPhase === "look"){
    return `
      <div class="pos-tag">👁️ Look · Cover · Write · Check</div>
      <div class="word-display">${word.w}</div>
      <button class="speak-btn" onclick="speak('${word.w.replace(/'/g,"\\'")}')">🔊</button>
      <div style="font-size:19px; color:var(--accent2); font-weight:700; margin-top:4px;">${word.t}</div>
      <div class="example-sent">${word.ex}</div>
      <div class="sub" style="margin-top:10px;">Внимательно рассмотри написание слова — буква за буквой. Потом закрой его и напиши по памяти.</div>
      <button class="btn" style="margin-top:16px;" onclick="setLcwcWrite()">Закрыл слово — пишу по памяти →</button>
    `;
  }
  return `
    <div class="pos-tag">👁️ Look · Cover · Write · Check</div>
    <div style="font-size:19px; color:var(--accent2); font-weight:700;">${word.t}</div>
    <div class="sub" style="margin-top:8px;">Напиши слово по памяти — точно так, как оно пишется</div>
    <input id="lcwcInput" class="type-input" lang="en" inputmode="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="type from memory..." ${fb?'disabled':''}
      onkeydown="if(event.key==='Enter')submitLcwc()">
    ${fb? `
      ${fb.correct? '' : spellDiffHTML(fb.typed, word.w)}
      <div style="margin-top:12px; color:${fb.correct?'var(--good)':'var(--bad)'}; font-weight:700;">
        ${fb.correct? '✓ Верно!' : 'Ошибка в написании'}
      </div>
      ${fb.correct? '' : `<div class="correct-word">Правильно: <b>${word.w}</b></div>`}
      <button class="btn" style="margin-top:14px;" onclick="nextCard()">Далее</button>
    ` : `<button class="btn secondary" style="margin-top:14px;" onclick="submitLcwc()">Проверить</button>`}
  `;
}
function setLcwcWrite(){
  SESSION.lcwcPhase = "write";
  render();
  setTimeout(()=>{ const el=document.getElementById("lcwcInput"); if(el) el.focus(); }, 50);
}
function submitLcwc(){
  const word = SESSION.queue[SESSION.idx];
  const input = document.getElementById("lcwcInput");
  const typed = (input? input.value : "").trim();
  const correct = typed.toLowerCase() === word.w.toLowerCase();
  SESSION.feedback = {correct, typed};
  scheduleWord(word.w, correct?4:0);
  if(correct) SESSION.correctCount++;
  else { recordMistake(word, typed); requeueForRetry(word); }
  render();
  setTimeout(()=>{ const el=document.getElementById("lcwcInput"); if(el) el.focus(); }, 50);
}

function nextCard(){
  SESSION.idx++;
  SESSION.mode = null;
  SESSION.opts = null;
  SESSION.feedback = null;
  SESSION.spoken = false;
  SESSION.typedGuess = null;
  SESSION.lcwcPhase = null;
  render();
}

/* ---- TEST MODE (независимая проверка, не влияет на SRS/XP-цикл сессий) ---- */
function getStartedWords(){
  return WORDS.filter(w => STATE.progress[w.w].status !== "new");
}

function renderTest(){
  const holder = document.getElementById("view");
  const started = getStartedWords();

  if(!TEST){
    if(started.length === 0){
      holder.innerHTML = `
        <div class="card">
          <h2>📝 Тест на знание слов</h2>
          <div class="empty-state">
            🌱 Пока нет слов в изучении.<br>Пройди хотя бы одно занятие на вкладке «Практика» — и здесь появятся слова для теста.
          </div>
        </div>
      `;
      return;
    }
    const lenOptions = [10,20,40,started.length].filter((n,i,arr)=> n<=started.length && arr.indexOf(n)===i);
    if(TEST_LEN > started.length) TEST_LEN = lenOptions[lenOptions.length-1];
    holder.innerHTML = `
      <div class="card">
        <h2>📝 Тест на знание слов</h2>
        <div class="sub">Показываю перевод — ты печатаешь английское слово или фразу. Проверяю точное написание, буква за буквой. Слова берутся из тех, что ты уже начал изучать (<b style="color:var(--text)">${started.length}</b> сейчас в работе). Результат не влияет на повторения в разделе «Практика».</div>
        <div class="filter-row" style="margin-top:16px;">
          ${lenOptions.map(n=>`
            <div class="filter-chip ${TEST_LEN===n?'active':''}" onclick="TEST_LEN=${n}; renderTest()">${n===started.length?'Все ('+n+')':n}</div>
          `).join("")}
        </div>
        <button class="btn" style="margin-top:6px;" onclick="startTest()">▶ Начать тест</button>
      </div>
    `;
    return;
  }

  if(TEST.idx >= TEST.queue.length){
    const pct = Math.round((TEST.correctCount / TEST.queue.length) * 100);
    holder.innerHTML = `
      <div class="card" style="text-align:center;">
        <div style="font-size:46px;">${pct>=80?'🏆':pct>=50?'👍':'📚'}</div>
        <h2 style="margin-top:10px;">Тест завершён!</h2>
        <div class="big-num" style="margin-top:6px;">${pct}%</div>
        <div class="sub">${TEST.correctCount} из ${TEST.queue.length} слов написаны верно</div>
        <button class="btn" style="margin-top:18px;" onclick="TEST=null; render()">Пройти ещё раз</button>
      </div>
      ${TEST.missed.length? `
        <div class="card">
          <h2>Стоит повторить</h2>
          ${TEST.missed.map(m=>`
            <div class="dict-row">
              <div>
                <div class="dict-w">${m.w}</div>
                <div class="dict-t">${m.t}</div>
              </div>
            </div>
          `).join("")}
        </div>
      ` : ''}
    `;
    return;
  }

  const word = TEST.queue[TEST.idx];
  const fb = TEST.feedback;
  const progressPct = (TEST.idx / TEST.queue.length) * 100;
  holder.innerHTML = `
    <div class="progressbar" style="margin:0 0 14px;"><div class="progressbar-fill" style="width:${progressPct}%"></div></div>
    <div class="card exercise">
      <div class="sub">Вопрос ${TEST.idx+1} из ${TEST.queue.length}</div>
      <div style="font-size:21px; font-weight:800; color:var(--accent2); margin:10px 0 4px;">${word.t}</div>
      <div class="pos-tag">${word.p} · ${CAT_LABELS[word.cat]}</div>
      <div class="sub" style="margin-top:12px;">Напиши слово (или фразу) на английском</div>
      <input id="testInput" class="type-input" lang="en" inputmode="text" spellcheck="true" autocomplete="off" autocapitalize="off" placeholder="type here..." ${fb?'disabled':''}
        onkeydown="if(event.key==='Enter')submitTest()">
      ${fb? `
        ${fb.correct? '' : spellDiffHTML(fb.typed, word.w)}
        <div style="margin-top:12px; color:${fb.correct?'var(--good)':'var(--bad)'}; font-weight:700;">
          ${fb.correct? '✓ Верно!' : 'Ошибка в написании'}
        </div>
        ${fb.correct? '' : `<div class="correct-word">Правильно: <b>${word.w}</b></div>`}
        <button class="btn" style="margin-top:14px;" onclick="nextTestQuestion()">${TEST.idx+1>=TEST.queue.length?'Результат':'Далее'}</button>
      ` : `<button class="btn secondary" style="margin-top:14px;" onclick="submitTest()">Проверить</button>`}
    </div>
  `;
  setTimeout(()=>{ const el=document.getElementById("testInput"); if(el && !fb) el.focus(); }, 50);
}
let TEST_LEN = 20;
function startTest(){
  const started = getStartedWords();
  const queue = [...started].sort(()=>Math.random()-0.5).slice(0, Math.min(TEST_LEN, started.length));
  TEST = { queue, idx:0, correctCount:0, feedback:null, missed:[] };
  render();
}
function submitTest(){
  const word = TEST.queue[TEST.idx];
  const input = document.getElementById("testInput");
  const typed = (input? input.value : "").trim();
  const correct = typed.toLowerCase() === word.w.toLowerCase();
  TEST.feedback = {correct, typed};
  if(correct) TEST.correctCount++;
  else TEST.missed.push({w:word.w, t:word.t});
  render();
}
function nextTestQuestion(){
  TEST.idx++;
  TEST.feedback = null;
  if(TEST.idx >= TEST.queue.length){
    STATE.xp += TEST.correctCount * 8;
    save();
  }
  render();
}

/* ---- DICTIONARY ---- */
let DICT_FILTER = "all";
let DICT_SEARCH = "";
function renderDict(){
  const holder = document.getElementById("view");
  let list = WORDS.filter(w=>{
    const okCat = DICT_FILTER==="all" || w.cat===DICT_FILTER;
    const okSearch = !DICT_SEARCH || w.w.toLowerCase().includes(DICT_SEARCH) || w.t.includes(DICT_SEARCH);
    return okCat && okSearch;
  });
  holder.innerHTML = `
    <div class="card">
      <input class="dict-search" placeholder="Поиск слова или перевода..." value="${DICT_SEARCH}"
        oninput="DICT_SEARCH=this.value.toLowerCase(); renderDict()">
      <div class="filter-row">
        ${CATS.map(c=>`<div class="filter-chip ${DICT_FILTER===c.id?'active':''}" onclick="DICT_FILTER='${c.id}'; renderDict()">${c.lb}</div>`).join("")}
      </div>
      <div>
        ${list.length? list.map(w=>{
          const st = STATE.progress[w.w].status;
          return `<div class="dict-row">
            <div>
              <div class="dict-w">${w.w} <span class="pos-tag" style="margin-left:4px;">${CAT_LABELS[w.cat]}</span></div>
              <div class="dict-t">${w.t}</div>
            </div>
            <span class="status-dot dot-${st==='new'?'new':st==='learning'?'learn':st==='review'?'review':'master'}"></span>
          </div>`;
        }).join("") : `<div class="empty-state">Ничего не найдено</div>`}
      </div>
    </div>
  `;
}

/* ---- STATS ---- */
function renderStats(){
  const holder = document.getElementById("view");
  const s = stats();
  const days = [];
  for(let i=39;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    days.push(STATE.history[key]||0);
  }
  const cells = days.map(c=>{
    let cls = "hcell";
    if(c>0 && c<5) cls += " l1"; else if(c>=5&&c<10) cls+=" l2"; else if(c>=10&&c<18) cls+=" l3"; else if(c>=18) cls+=" l4";
    return `<div class="${cls}"></div>`;
  }).join("");

  const totalAns = WORDS.reduce((a,w)=>a+STATE.progress[w.w].correct+STATE.progress[w.w].wrong,0);
  const totalCorrect = WORDS.reduce((a,w)=>a+STATE.progress[w.w].correct,0);
  const acc = totalAns? Math.round((totalCorrect/totalAns)*100) : 0;

  holder.innerHTML = `
    <div class="card">
      <h2>📊 Общий прогресс к Band 6.0</h2>
      <div class="grid2">
        <div class="mini-card"><div class="n">${s.new}</div><div class="l">новые</div></div>
        <div class="mini-card"><div class="n">${s.learning}</div><div class="l">изучаются</div></div>
        <div class="mini-card"><div class="n">${s.review}</div><div class="l">на повторении</div></div>
        <div class="mini-card"><div class="n">${s.mastered}</div><div class="l">усвоено</div></div>
      </div>
      <div class="progressbar" style="margin:16px 0 0; padding:0;">
        <div class="progressbar-fill" style="width:${(s.mastered/WORDS.length)*100}%"></div>
      </div>
      <div class="sub">${s.mastered} из ${WORDS.length} слов усвоено (${Math.round((s.mastered/WORDS.length)*100)}%)</div>
    </div>
    <div class="card">
      <h2>🔥 Активность за 40 дней</h2>
      <div class="heatmap">${cells}</div>
    </div>
    <div class="card">
      <h2>🎯 Точность</h2>
      <div class="big-num">${acc}%</div>
      <div class="sub">правильных ответов из ${totalAns} попыток</div>
    </div>
    <div class="card">
      <h2>💾 Резервная копия</h2>
      <div class="sub">Весь прогресс хранится только в этом браузере. Сохрани копию, чтобы не потерять её при очистке кэша или смене устройства.</div>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn secondary" onclick="exportBackup()">⬇️ Скачать копию</button>
        <button class="btn secondary" onclick="document.getElementById('restoreFile').click()">⬆️ Восстановить из файла</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="importBackup(event)">
    </div>
  `;
}

/* ---- BACKUP / RESTORE ---- */
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `lexispark-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("Резервная копия сохранена");
  }catch(e){
    toast("Не удалось создать копию");
  }
}
function importBackup(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== "object" || !parsed.progress){
        toast("Файл повреждён или не подходит");
        return;
      }
      STATE = parsed;
      WORDS.forEach((w)=>{
        if(!STATE.progress[w.w]){
          STATE.progress[w.w] = {rep:0, ef:2.5, interval:0, due:0, status:"new", correct:0, wrong:0, stage:"new", recCorrect:0, mistakes:[]};
        }
        if(STATE.progress[w.w].mistakes === undefined) STATE.progress[w.w].mistakes = [];
      });
      save();
      toast("Прогресс восстановлен");
      render();
    }catch(e){
      toast("Не удалось прочитать файл");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

/* ---- ACHIEVEMENTS ---- */
function renderAch(){
  const holder = document.getElementById("view");
  holder.innerHTML = `
    <div class="card">
      <h2>🏅 Награды</h2>
      ${ACHIEVEMENTS.map(a=>{
        const unlocked = STATE.unlocked.includes(a.id);
        return `<div class="ach ${unlocked?'unlocked':'locked'}">
          <div class="ach-icon">${a.icon}</div>
          <div>
            <div class="ach-name">${a.name}</div>
            <div class="ach-desc">${a.desc}</div>
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

injectManifest();
render();
</script>
